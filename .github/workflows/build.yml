name: Build and Release Hilt

on:
  push:
    branches:
      - "Neo/1.21.1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Read Version
        id: gradle_props
        run: |
          minecraft_version="$(awk -F= '$1 == "minecraft_version" { print $2; exit }' gradle.properties | tr -d '\r')"
          mod_version="$(awk -F= '$1 == "mod_version" { print $2; exit }' gradle.properties | tr -d '\r')"
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${mod_version}" >> "$GITHUB_OUTPUT"
          echo "jar=build/libs/Hilt-${minecraft_version}-${mod_version}.jar" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --no-daemon --console=plain

      - name: Verify Hilt JAR
        run: |
          test -f "${{ steps.gradle_props.outputs.jar }}"
          echo "Built ${{ steps.gradle_props.outputs.jar }}"

      - name: Check for existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.gradle_props.outputs.release_tag }}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.gradle_props.outputs.release_tag }} already exists; skipping release creation."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Hilt latest release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.gradle_props.outputs.release_tag }}" \
            "${{ steps.gradle_props.outputs.jar }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Hilt ${{ steps.gradle_props.outputs.mod_version }}" \
            --generate-notes \
            --latest
